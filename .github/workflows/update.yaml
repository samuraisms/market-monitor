name: Update Market Monitor
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, after the US close year-round
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python scan.py
      - run: |
          git config user.name "market-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update data" && git push)
